<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>松山YEG 夜の飲食店MAP</title>
<meta name="description" content="松山YEG会員が経営する夜の飲食店を地図から探せる、飲み歩きマップです。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb"
      crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark">松山YEG</span>
      <h1 class="brand-title">夜の飲食店MAP</h1>
    </div>
    <p class="brand-lead">松山YEG会員が営む、夜のお店を地図から探せる飲み歩きマップ</p>
  </div>
</header>

<div class="layout">

  <!-- 地図 -->
  <div class="map-pane">
    <div id="map" role="application" aria-label="店舗マップ"></div>
    <button type="button" id="resetView" class="map-reset" title="地図表示をリセット">全体表示に戻す</button>
  </div>

  <!-- 一覧 -->
  <div class="list-pane">

    <div class="filters">
      <div class="search-row">
        <input type="search" id="keyword" class="search-input"
               placeholder="店名・エリア・キーワードで検索" aria-label="キーワード検索">
      </div>
      <div class="chip-row" id="categoryChips" role="group" aria-label="ジャンルで絞り込み"></div>
      <div class="chip-row" id="areaChips" role="group" aria-label="エリアで絞り込み"></div>
      <p class="result-count" id="resultCount" aria-live="polite"></p>
    </div>

    <ul class="shop-list" id="shopList"></ul>

    <p class="empty-state" id="emptyState" hidden>
      条件に合うお店が見つかりませんでした。<br>検索条件を変えてお試しください。
    </p>
  </div>

</div>

<footer class="site-footer">
  <p>松山商工会議所青年部（松山YEG） 会員店舗マップ</p>
  <p class="footer-note">掲載内容は変更になる場合があります。ご来店前に各店舗へご確認ください。</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="js/data-source.js"></script>
<script src="js/app.js"></script>
</body>
</html>
